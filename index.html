<!DOCTYPE html>
<html>
<head>
<title>Procedural Landscape Generator</title>
</head>

<body>

<h1>Procedural Landscape Generator</h1>

<button onclick="generateTerrain()">Generate Terrain</button>

<br><br>

<canvas id="terrain" width="500" height="500"></canvas>

<script>

function generateTerrain(){

const canvas = document.getElementById("terrain");
const ctx = canvas.getContext("2d");

for(let x = 0; x < canvas.width; x++){
  for(let y = 0; y < canvas.height; y++){

    let randomHeight = Math.random() * 255;

    ctx.fillStyle = `rgb(${randomHeight},${randomHeight},${randomHeight})`;
    ctx.fillRect(x,y,1,1);

  }
}

}

generateTerrain();

</script>

</body>
</html>
