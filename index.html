<!DOCTYPE html>
<html>

<head>
<title>Procedural Landscape Generator</title>

<style>
body{
font-family: Arial;
text-align: center;
background: #111;
color: white;
}

canvas{
border:2px solid white;
margin-top:20px;
}
</style>

</head>

<body>

<h1>Procedural Landscape Generator</h1>

<p>
This interactive system generates procedural landscapes using algorithmic randomness.
Each time the button is pressed, a new terrain pattern is created that simulates
water, grass, hills, and mountains.
</p>

<button onclick="generateTerrain()">Generate Terrain</button>

<br><br>

<canvas id="terrain" width="500" height="500"></canvas>

<script>

function generateTerrain(){

const canvas = document.getElementById("terrain");
const ctx = canvas.getContext("2d");

for(let x = 0; x < canvas.width; x++){
  for(let y = 0; y < canvas.height; y++){

    let height = Math.random();

    if(height < 0.3){
      ctx.fillStyle = "blue";     // water
    }
    else if(height < 0.6){
      ctx.fillStyle = "green";    // grass
    }
    else if(height < 0.8){
      ctx.fillStyle = "brown";    // hills
    }
    else{
      ctx.fillStyle = "white";    // mountains
    }

    ctx.fillRect(x,y,1,1);

  }
}

}

generateTerrain();

</script>

</body>
</html>
