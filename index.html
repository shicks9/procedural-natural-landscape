<!DOCTYPE html>
<html>
<head>
<title>Procedural Landscape Generator</title>
</head>

<body>

<h1>Procedural Landscape Generator</h1>

<button onclick="generateTerrain()">Generate Terrain</button>

<br><br>

<canvas id="terrain" width="500" height="500"></canvas>

<script>

function generateTerrain(){

const canvas = document.getElementById("terrain");
const ctx = canvas.getContext("2d");

for(let x = 0; x < canvas.width; x++){
  for(let y = 0; y < canvas.height; y++){

   let height = Math.random();

if(height < 0.3){
  ctx.fillStyle = "blue";   // water
}
else if(height < 0.6){
  ctx.fillStyle = "green";  // grass
}
else if(height < 0.8){
  ctx.fillStyle = "brown";  // hills
}
else{
  ctx.fillStyle = "white";  // mountains
}

ctx.fillRect(x,y,1,1);

  }
}

}

generateTerrain();

</script>

</body>
</html>
